# 1.8.9 原版类/方法映射表(MCP 反混淆名,Task 1 结论:jar = mcp918/temp/minecraft_rg.jar,
# 含 MCP 名,直接可用;lib/mc-versions/vanilla-1.8.9.jar 为该 jar 副本)。
# 每条目经 ~/minecraft1.8.9/mcp918/src/minecraft 逆向源码核实(记录见 task-m5-7-report.md)。
# 语义键 → 1.8.9 MCP 名;Provider 只读此表,不硬编码类名/方法名。
# 与 26.2 的语义差异(签名/返回形态)全部由 Provider 吸收,见 Provider 头注释。

# --- 类 ---
block.class=net.minecraft.block.Block
blockstate.class=net.minecraft.block.state.IBlockState
property.class=net.minecraft.block.properties.IProperty
item.class=net.minecraft.item.Item
itemstack.class=net.minecraft.item.ItemStack
world.class=net.minecraft.world.World
worldprovider.class=net.minecraft.world.WorldProvider
entity.class=net.minecraft.entity.Entity
sharedmonsterattributes.class=net.minecraft.entity.SharedMonsterAttributes
player.class=net.minecraft.entity.player.EntityPlayerMP
container.class=net.minecraft.inventory.IInventory
registry.class=net.minecraft.util.RegistryNamespaced
resloc.class=net.minecraft.util.ResourceLocation
blockpos.class=net.minecraft.util.BlockPos
nbt.class=net.minecraft.nbt.NBTTagCompound
nbtio.class=net.minecraft.nbt.CompressedStreamTools
gametype.class=net.minecraft.world.WorldSettings$GameType
attrinstance.class=net.minecraft.entity.ai.attributes.IAttributeInstance

# --- Block ---
block.defaultstate=getDefaultState
block.registry=blockRegistry
block.registryname=getNameForObject
# --- BlockState(IBlockState;getProperties 返回 ImmutableMap<IProperty,Comparable>,
#     26.2 为 Collection——Provider 按 Map/Collection 双形态处理) ---
blockstate.block=getBlock
blockstate.properties=getProperties
blockstate.value=getValue
property.name=getName
# --- Item ---
item.registry=itemRegistry
item.registryname=getNameForObject
item.maxstack=getItemStackLimit            # 1.8.9 无参(26.2 getDefaultMaxStackSize(ItemStack) 有参)
# --- ItemStack ---
itemstack.item=getItem
itemstack.count=stackSize                   # 1.8.9 public 字段(无 getStackSize 访问器)
itemstack.copy=copy
# --- World ---
world.dimension=provider                    # public final WorldProvider provider 字段
world.dimname=getDimensionId                # WorldProvider.getDimensionId() → int,Provider 合成维度名
world.blockstate=getBlockState
world.setblockstate=setBlockState           # 写路径:World.setBlockState(BlockPos, IBlockState)(World.java:429,
                                            # 内部 flags=3,与 26.2 Provider 显式传 3 对齐)
world.entity=getEntityByID
world.entities=loadedEntityList             # public final List<Entity> 字段(26.2 为方法)
world.gametime=getTotalWorldTime
world.save=saveAllChunks                    # WorldServer.saveAllChunks(boolean, IProgressUpdate);
                                            # 非 Server World 无此方法 → Provider 静默跳过(契约环境 no-op)
world.tick=tick                             # 1.8.9 World.tick() 无参(World.java:2476 / WorldServer.java:166)
# --- Entity ---
entity.id=getEntityId
entity.x=posX
entity.y=posY
entity.z=posZ
# 1.8.9 无 EntityType 注册表:registryName 由类名合成(Provider 记录规则)
entity.attribute=getEntityAttribute         # 仅 EntityLivingBase 有(Entity 无;非 Living 实体 → 句柄异常)
attrinstance.value=getAttributeValue
# 属性常量 1.8.9 在 net.minecraft.entity.SharedMonsterAttributes
# ("generic.maxHealth" 等);"minecraft:max_health" → camelCase 字段名,Provider 记录规则
# --- Player(EntityPlayerMP) ---
player.profile=getGameProfile
player.name=getName
player.mode=theItemInWorldManager           # public final 字段 → getGameType().getID()
player.connection=playerNetServerHandler    # public 字段(仅 EntityPlayerMP 有)
playermgr.gametype=getGameType
gametype.id=getID
# --- Container(IInventory) ---
container.size=getSizeInventory
container.item=getStackInSlot
container.setitem=setInventorySlotContents
# --- Registry(1.8.9 形态:RegistryNamespaced,键为 ResourceLocation,id↔名双向。
#     Block.blockRegistry 为 RegistryNamespacedDefaultedByKey —— 未注册键/id 返回默认值
#     (air),因此 id() 须先 containsKey 存在性守卫(与 26.2 DefaultedRegistry 同款守卫);
#     Item.itemRegistry 为普通 RegistryNamespaced(无默认值) ---
registry.id=getIDForObject
registry.key=getNameForObject
registry.value=getObject
registry.byid=getObjectById
registry.containskey=containsKey
# M8-A 注册写路径:RegistryNamespaced.register(int, K, V)(逆向核实
# RegistryNamespaced.java:18-22:underlyingIntegerMap.put + putObject;
# RegistrySimple.putObject 对重名仅 debug 日志覆盖不抛错(RegistrySimple.java:56-61)
# → Provider 先 containsKey 守卫统一抛 MosaicApiException;数字 id 由 Provider
# 分配(无自动分配 API——ObjectIntIdentityMap.java 仅 put/get/getByValue) ---
registry.register=register
# --- NBT(1.8.9 语义:getString/getInteger 直接返回 String/int,缺失 → ""/0,
#      无 26.2 的 Optional 解包) ---
nbt.putstring=setString
nbt.putint=setInteger
nbt.getstring=getString
nbt.getint=getInteger
nbt.keys=getKeySet
nbt.contains=hasKey
nbtio.write=writeCompressed                 # 1.8.9 无 writeUncompressed;gzip 压缩写
# --- Command(M7-B:1.8.9 命令对象 = net.minecraft.command.CommandHandler。
#     逆向核实 ~/minecraft1.8.9/mcp918/src/minecraft/net/minecraft/command/CommandHandler.java:
#     类无声明构造器(隐式无参构造;字段内联初始化 commandMap/commandSet,无 server 依赖);
#     registerCommand(ICommand) → commandMap.put(getCommandName());getCommands() → commandMap。
#     ICommand 为接口(7 方法 + Comparable<ICommand>),Provider 以动态代理实现;
#     契约环境无 ICommandSender,execute 不可测,仅断言注册后命令表) ---
commandhandler.class=net.minecraft.command.CommandHandler
commandhandler.register=registerCommand
commandhandler.commands=getCommands
icommand.class=net.minecraft.command.ICommand
