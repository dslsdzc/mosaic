# M8-A 注册写路径:静态 Registry.register(Registry, ResourceKey, T)(MappedRegistry 内
# register 对重复键/重复值/frozen 抛 IllegalStateException —— Provider 吸收为
# MosaicApiException;逆向核实 MappedRegistry.java:88-98/75-85) ---
registry.register=register
# --- 注册表静态字段名(BuiltInRegistries / Registries) ---
registry.block=BLOCK
registry.item=ITEM
registry.attribute=ATTRIBUTE
registry.entitytype=ENTITY_TYPE
registry.datacomponent=DATA_COMPONENT_TYPE
# --- ResourceKey / Identifier / Holder ---
reskey.class=net.minecraft.resources.ResourceKey
reskey.identifier=identifier
reskey.create=create
holder.key=key
identifier.parse=tryParse
