# 26.2 无 Item.getMaxDamage:maxDamage 为组件(DataComponents.MAX_DAMAGE;ItemStack.
# getMaxDamage = getOrDefault(MAX_DAMAGE, 0),ItemStack.java:432);可损坏 ⇔ maxDamage > 0
# (ItemStack.isDamageableItem 组件语义,无 Item.isDamageable 方法)
item.maxdamage=MAX_DAMAGE
# --- Enchantment(M8-B:26.2 为记录,非抽象类——record Enchantment(Component description,
#     EnchantmentDefinition definition, HolderSet exclusiveSet, DataComponentMap effects),
#     Enchantment.java:47;EnchantmentDefinition 记录含 maxLevel。契约环境可构造(轻参):
#     Component.translatable + Enchantment$EnchantmentDefinition 构造器 + HolderSet.empty()
#     + DataComponentMap.EMPTY;Enchantments.* 为 ResourceKey 非实例(Enchantments.java),
#     ENCHANTMENT 注册表为数据驱动(Registries.java:274),契约环境无注册表 → 裸记录
#     的 registryName 经 Holder.key() 直读,非 Holder 回退 "unknown" ---
enchantment.class=net.minecraft.world.item.enchantment.Enchantment
enchantment.definition=definition
enchantment.maxlevel=maxLevel
enchantment.description=description
component.contents=getContents
translatablecontents.class=net.minecraft.network.chat.contents.TranslatableContents
translatablecontents.key=getKey
# --- Recipe(M8-B:26.2 Recipe 为接口,契约环境不可轻量构造(实现需 RecipeSerializer +
#     codec 装配)→ Provider null 语义为主,真实路径待服务端;注册名经 RecipeHolder.id()
#     (RecipeHolder(ResourceKey id, T value) 记录,RecipeHolder.java:6);输出无直接
#     访问器(display() → List<RecipeDisplay> → result() 为 SlotDisplay,需服务端上下文
#     解析,SlotDisplay 接口,display/RecipeDisplay.java:14)→ best-effort null;
#     type() 经 BuiltInRegistries.RECIPE_TYPE 注册表键 ---
recipe.class=net.minecraft.world.item.crafting.Recipe
recipe.type=getType
# 文档性条目(Provider 未引用,死条目清理后保留备查):recipe.display=display、
# recipeholder.class=net.minecraft.world.item.crafting.RecipeHolder
recipeholder.id=id
registry.recipetype=RECIPE_TYPE
# --- Command(M7-B:26.2 命令对象 = com.mojang.brigadier.CommandDispatcher(Brigadier 库,
#     在 Mojang 运行库内)。无参构造;javap 核实 brigadier-1.3.10.jar:
#     CommandDispatcher() / register(LiteralArgumentBuilder) / getRoot();
#     CommandNode.getName()/getChildren();LiteralArgumentBuilder.literal(String);
#     Command.run(CommandContext) / CommandContext.getInput()。
#     register 在无服务器环境仅操作本地树;execute 需 CommandSourceStack 不可用) ---
dispatcher.class=com.mojang.brigadier.CommandDispatcher
dispatcher.register=register
dispatcher.root=getRoot
commandnode.class=com.mojang.brigadier.tree.CommandNode
commandnode.name=getName
commandnode.children=getChildren
literal.class=com.mojang.brigadier.builder.LiteralArgumentBuilder
literal.literal=literal
literal.executes=executes
command.class=com.mojang.brigadier.Command
commandcontext.input=getInput
